<!DOCTYPE html>
{% load static %}
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Acceso Administrativo - Suazapawa</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#f8fafc] flex items-center justify-center min-h-screen">
    <div class="bg-white p-10 rounded-3xl shadow-2xl w-full max-w-md border-t-8 border-[#002878]">
        <div class="text-center mb-8">
            <img src="{% static 'img/logo-suaza.png' %}" class="h-20 mx-auto mb-4 p-2 bg-[#FFFFFF] rounded-xl">
            <h2 class="text-2xl font-black text-[#002878]">Panel Administrativo</h2>
        </div>
        
        <form method="POST" class="space-y-6">
            {% csrf_token %}
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Usuario</label>
                <input type="text" name="username" class="w-full p-4 bg-gray-50 border rounded-xl focus:ring-[#E3003F]" required>
            </div>
            <div>
                <label class="block text-sm font-bold text-gray-700 mb-2">Contraseña</label>
                <input type="password" name="password" class="w-full p-4 bg-gray-50 border rounded-xl focus:ring-[#E3003F]" required>
            </div>
            
            {% if form.errors %}
                <p class="text-[#E3003F] text-sm font-bold text-center">Usuario o contraseña incorrectos.</p>
            {% endif %}
            
            <button type="submit" class="w-full bg-[#E3003F] text-white font-bold py-4 rounded-xl hover:bg-red-800 transition shadow-lg">Iniciar Sesión</button>
        </form>
        <a href="{% url 'inicio' %}" class="block text-center mt-6 text-sm text-gray-400 hover:text-[#002878]">Volver al portal</a>
    </div>
</body>
</html>
