<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>{{ titulo }} - Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-gray-100 flex items-center justify-center min-h-screen py-12">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-2xl border-t-4 border-[#002878]">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-2xl font-bold text-gray-800">{{ titulo }}</h1>
            <a href="{% url volver %}" class="text-gray-400 hover:text-red-600 font-bold transition"><i class="fas fa-times text-xl"></i></a>
        </div>
        <form method="POST" enctype="multipart/form-data" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <div class="pt-4 border-t flex justify-end">
                <button type="submit" class="bg-[#d41118] text-white px-8 py-3 rounded-xl font-bold hover:bg-red-800 transition shadow-lg"><i class="fas fa-save mr-2"></i> Guardar Cambios</button>
            </div>
        </form>
    </div>
</body>
</html>
